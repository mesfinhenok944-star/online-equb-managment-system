name: equb_app
description: Online Equb - Ethiopian Digital Savings Association
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # Storage
  shared_preferences: ^2.3.2

  # HTTP
  http: ^1.2.1
  dio: ^5.7.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  pinput: ^5.0.0
  confetti: ^0.7.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/levels/
    - assets/images/levels/low.jpg
    - assets/images/levels/low_equb.jpg
    - assets/images/levels/medium.jpg
    - assets/images/levels/meduim.jpg
    - assets/images/levels/medium_equb.jpg
    - assets/images/levels/high.jpg
    - assets/images/levels/high_equb.jpg
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
